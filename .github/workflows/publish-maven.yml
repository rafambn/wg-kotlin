name: Publish Maven

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-runtimes:
    name: BoringTun ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            resource-prefix: win32-x86-64
            library: wg_kotlin_uniffi_boringtun.dll
          - os: macos-15-intel
            target: x86_64-apple-darwin
            resource-prefix: darwin-x86-64
            library: libwg_kotlin_uniffi_boringtun.dylib
          - os: macos-15
            target: aarch64-apple-darwin
            resource-prefix: darwin-aarch64
            library: libwg_kotlin_uniffi_boringtun.dylib
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            resource-prefix: linux-x86-64
            library: libwg_kotlin_uniffi_boringtun.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            resource-prefix: linux-aarch64
            library: libwg_kotlin_uniffi_boringtun.so

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native runtime
        run: cargo build --manifest-path boringtun/Cargo.toml --locked --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}

      - name: Stage JNA resource
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RESOURCE_PREFIX: ${{ matrix.resource-prefix }}
          LIBRARY: ${{ matrix.library }}
        run: |
          mkdir -p "native-runtimes/$RESOURCE_PREFIX"
          cp "boringtun/target/$TARGET/release/$LIBRARY" "native-runtimes/$RESOURCE_PREFIX/$LIBRARY"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: boringtun-${{ matrix.target }}
          path: native-runtimes/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Assemble and publish WG-Kotlin
    needs: native-runtimes
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable

      - uses: gradle/actions/setup-gradle@v6.4.1

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: boringtun-*
          merge-multiple: true
          path: native-runtimes

      - name: Verify complete native runtime set
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./gradlew :wg-kotlin:verifyNativeRuntimes -PnativeRuntimeDirectory="$PWD/native-runtimes"

      - name: Build and publish locally for consumer verification
        run: >-
          ./gradlew :wg-kotlin:build publishToMavenLocal
          -PnativeRuntimeDirectory="$PWD/native-runtimes"
          -PsignAllPublications=false

      - name: Verify JVM consumer with one dependency
        run: ./gradlew -p tests/jvm-consumer run -PverifyAllNativeRuntimes=true

      - name: Publish WG-Kotlin to Maven Central
        if: github.event_name == 'release'
        run: ./gradlew publishAndReleaseToMavenCentral -PnativeRuntimeDirectory="$PWD/native-runtimes"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
