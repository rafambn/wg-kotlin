syntax = "proto3";

package wgdaemon;

import "dns_config.proto";
import "ip_addr.proto";

option java_multiple_files = true;
option java_package = "com.rafambn.wgkotlin.daemon.proto";

message TunSessionConfig {
    string interface_name = 1;
    int32 mtu = 2;
    repeated IpAddr addresses = 3;
    repeated IpAddr peer_allowed_ips = 4;
    repeated IpAddr peer_endpoints = 5;
    DnsConfig dns = 6;
}
