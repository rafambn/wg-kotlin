:root { color-scheme: light dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; }

.legend { display: flex; gap: 10px 16px; flex-wrap: wrap; color: var(--muted-foreground, GrayText); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sample { width: 22px; border-top: 2px solid; }
.control.sample { border-top-style: dashed; }
.control { color: var(--chart-3, GrayText); }
.local { color: var(--muted-foreground, GrayText); }
.ip { color: var(--chart-1, Highlight); }
.wire { color: var(--chart-2, Highlight); }
.canvas { overflow-x: auto; margin-top: 10px; }
svg { display: block; width: 100%; min-width: 660px; height: auto; }
.group rect { fill: var(--muted, Canvas); fill-opacity: .3; stroke: var(--border, GrayText); stroke-dasharray: 5 5; rx: 14px; }
.group text { fill: var(--muted-foreground, GrayText); font-size: 12px; font-weight: 600; }
.edge { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.edge.control { stroke: var(--chart-3, GrayText); stroke-dasharray: 5 5; }
.edge.local { stroke: var(--muted-foreground, GrayText); }
.edge.ip { stroke: var(--chart-1, Highlight); }
.edge.wire { stroke: var(--chart-2, Highlight); }
.edge-label rect { fill: var(--background, Canvas); rx: 4px; }
.edge-label text { fill: var(--muted-foreground, GrayText); font-size: 12px; }
.node { cursor: pointer; outline: none; }
.node rect { fill: var(--card, Canvas); stroke: var(--border, GrayText); stroke-width: 1.5; rx: 12px; }
.node.core rect { stroke: var(--chart-2, Highlight); stroke-width: 2; }
.node .title { fill: var(--foreground, CanvasText); font: 600 14px var(--font-mono, monospace); }
.node .sub { fill: var(--muted-foreground, GrayText); font-size: 13px; }
.node .tag { fill: var(--muted-foreground, GrayText); font-size: 10px; font-weight: 600; letter-spacing: .5px; }
.node.selected rect, .node:focus-visible rect { stroke: var(--primary, Highlight); stroke-width: 2.5; }
.node:hover rect { stroke: var(--primary, Highlight); }
.detail { margin-top: 12px; padding: 16px; border-radius: var(--radius, 12px); background: var(--card, Canvas); }
.detail strong { font-family: var(--font-mono, monospace); font-size: 14px; overflow-wrap: anywhere; }
.detail p { margin: 7px 0 9px; }
.detail small { color: var(--muted-foreground, GrayText); display: block; }
.foot, .sources { color: var(--muted-foreground, GrayText); font-size: 12px; margin: 12px 0 0; }
.sources a { color: var(--muted-foreground, GrayText); text-underline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) { .node rect { transition: stroke .15s; } }
</style>
</head>

function el(tag, attrs, text) {
  const item = document.createElementNS(NS, tag);
  for (const [key, value] of Object.entries(attrs || {})) item.setAttribute(key, value);

  return item;
}

  svg.querySelectorAll('.node').forEach(function (node) {
    const active = node.dataset.id === id;
    node.classList.toggle('selected', active);
    node.setAttribute('aria-pressed', String(active));
  });
}

    const attrs = {class: 'edge ' + kind, d: path, 'marker-end': 'url(#arrow-' + kind + ')'};

    svg.append(el('path', attrs));
  }

    button.setAttribute('aria-selected', String(active));
    button.tabIndex = active ? 0 : -1;
  });
  document.getElementById('diagram-panel').setAttribute('aria-labelledby', 'tab-' + view);
  document.getElementById('foot').textContent = graph.foot;
  const sources = document.getElementById('sources');
  sources.replaceChildren();
  if (graph.sources.length) {
    sources.append(document.createTextNode('Referências: '));
    graph.sources.forEach(function (id, index) {
      if (index) sources.append(document.createTextNode(' · '));
      const link = document.createElement('a');
      link.textContent = refs[id][0];
      link.href = refs[id][1];
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      sources.append(link);
    });
  }
  if (!graph.nodes.some(function (node) { return node[0] === selected; })) selected = 'core';
  choose(selected);
}
const tabs = Array.from(document.querySelectorAll('[data-view]'));
tabs.forEach(function (button, index) {
  button.addEventListener('click', function () { draw(button.dataset.view); });
  button.addEventListener('keydown', function (event) {
    let next;
    if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
    else if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
    else if (event.key === 'Home') next = 0;
    else if (event.key === 'End') next = tabs.length - 1;
    else return;
    event.preventDefault();
    draw(tabs[next].dataset.view);
    tabs[next].focus();
  });
});
draw(initialView);
</script>
</body>
</html>
