* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; }
body { color: var(--foreground, CanvasText); font: 14px/1.5 var(--font-sans, system-ui); }
button { font: inherit; cursor: pointer; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

const details = {
  client: ['Cliente IPC do app', 'Abre uma conexão local por TUN. O kernel identifica o processo e o daemon verifica a instância viva do app antes de enviar Ready. A primeira mensagem do cliente contém TunSessionConfig; as seguintes carregam OutgoingPacket. Recebe Started, IncomingPacket ou Error. A conexão é named pipe no Windows ou Unix domain socket no Linux/macOS.', 'daemon-proto/src/lib.rs · contratos gerados de daemon-protocol/daemon.proto'],
  main: ['main.rs · inicialização do processo', 'Lê endpoint, owner-pid, owner-start-ms e log-path pela CLI. Verifica a instância do app, exige root ou Administrador e verifica os programas necessários. No Windows, prepara a DLL Wintun. Inicia o logger de texto e o listener IPC. Monitora a vida do app e autoriza cada conexão pelo PID fornecido pelo kernel.', 'daemon/src/main.rs · main(), run(), ensure_root(), prepare_wintun()'],
  service: ['DaemonService · entrada das sessões', 'O accept loop verifica a identidade do cliente e entrega a conexão local ao serviço. O serviço envia Ready, valida a configuração, reserva a interface, inicia TunSession e cria a tarefa que mantém o stream. Compartilha o canal do logger e mantém active_sessions por Arc<Mutex<...>>. Recusa processos que não correspondem à instância autorizada do app antes de ler configurações.', 'daemon/src/main.rs · daemon/src/server.rs · DaemonService'],
  proto: ['daemon-proto · contratos gerados', 'O build usa protoc vendorizado e prost para gerar ClientMessage, ServerMessage e TunSessionConfig. O transporte usa quadros protobuf com comprimento de quatro bytes. O código Rust inclui esses contratos com tonic::include_proto!. O schema compartilhado é a entrada de geração, fora deste workspace Cargo.', 'daemon-proto/build.rs · daemon-proto/src/lib.rs'],
  manager: ['SessionManager::start()', 'Prepara a plataforma, monta DeviceBuilder com nome utun, endereços e MTU e cria SyncDevice. No Unix, ativa modo não bloqueante. Cria InterruptEvent, aplica rotas e DNS e devolve TunSession com o hook de limpeza.', 'daemon/src/session.rs · SessionManager::start()'],
  tun: ['TunSession · dispositivo TUN', 'Agrupa o SyncDevice de tun-rs, InterruptEvent, indicador closed e CleanupHook em referências compartilhadas. read_packet() usa recv_intr(); write_packet() usa send_intr(). O descritor nativo é liberado quando as últimas referências ao dispositivo são descartadas.', 'daemon/src/session.rs · TunSession, read_packet(), write_packet(), close()'],
  platform: ['platform · configuração e limpeza', 'Seleciona linux.rs, macos.rs ou windows.rs em compilação. As plataformas usam RouteManager para rotas e comandos do sistema para DNS. configure_session() retorna uma closure FnOnce que tenta remover as rotas e desfazer o DNS ao fechar a sessão.', 'daemon/src/platform/mod.rs · configure_session(), into_cleanup_hook()'],
  logger: ['Logger', 'Enfileira mensagens de texto sem bloquear as tarefas de rede. Uma thread dedicada escreve no arquivo indicado por --log-path ou em stdout. A fila comporta até 256 entradas.', 'daemon/src/logging.rs · Logger::new(), Logger::log()'],
  file: ['stdout ou arquivo', 'Sem --log-path, as mensagens vão somente para stdout. Com um caminho, são acrescentadas somente ao arquivo informado. Diretórios ausentes são criados.', 'daemon/src/logging.rs · Logger::new()'],
  os: ['Sistema operacional', 'O sistema entrega à TUN os pacotes enviados pelas rotas configuradas. Pacotes escritos na TUN entram na pilha IP como recebidos pela interface virtual. O daemon também altera as tabelas de rotas e a configuração DNS do sistema.', 'daemon/src/session.rs · daemon/src/platform/'],
  config: ['Após autenticação · TunSessionConfig', 'Após autorizar o PID do cliente e enviar Ready, o serviço exige o payload Config na primeira mensagem da sessão. Os campos são interface_name, mtu, addresses, peer_allowed_ips, peer_endpoints e dns. Um pacote ou payload ausente nessa posição produz InvalidArgument.', 'daemon/src/server.rs · session(), extract_config() · daemon-proto/src/lib.rs'],
  validate: ['validation::validate_config()', 'Exige nome utun seguido de dígitos e até 15 caracteres, pelo menos um endereço, CIDRs e DNS válidos. Limita a 64 endereços, 256 rotas e 64 servidores DNS. MTU diferente de zero deve estar entre 576 e 65535, ou ao menos 1280 com IPv6. DNS deve fornecer servidores e domínios juntos.', 'daemon/src/validation.rs · validate_config()'],
  invalid: ['Configuração rejeitada', 'A validação devolve um erro. O handler registra daemon_session com outcome rejected e encerra o RPC com InvalidArgument. O dispositivo TUN ainda não foi criado.', 'daemon/src/server.rs · tratamento de validate_config()'],
  reserve: ['Reserva em active_sessions', 'Sob mutex, verifica se o nome solicitado já está reservado e se há menos de 16 sessões. Quando há espaço, insere o nome antes de chamar SessionManager::start(). A reserva também cobre uma inicialização em andamento.', 'daemon/src/server.rs · active_sessions, MAX_ACTIVE_SESSIONS'],
  denied: ['Interface ocupada ou limite atingido', 'Uma interface já reservada resulta em FailedPrecondition. O limite de 16 sessões resulta em ResourceExhausted. Ambos os casos são registrados como rejected e encerram o RPC antes de criar a TUN.', 'daemon/src/server.rs · duplicate_session, session_limit_reached'],
  startFail: ['Falha ao iniciar a sessão', 'Um Err de SessionManager::start() faz o handler remover a reserva pelo nome solicitado, registrar start_failed e devolver FailedPrecondition. Se a plataforma chegou a aplicar parte da configuração, seu caminho de erro tenta desfazê-la antes de devolver o erro.', 'daemon/src/server.rs · SessionManager::start() · daemon/src/platform/mod.rs'],
  rollback: ['Rollback de configuração parcial', 'into_cleanup_hook() recebe o resultado da configuração. Em caso de erro, chama cleanup_routes() e o teardown DNS antes de devolver a falha. Se a limpeza também falhar, acrescenta esse erro ao erro original.', 'daemon/src/platform/mod.rs · into_cleanup_hook(), cleanup_routes()'],
  started: ['Started · resposta inicial', 'Com TunSession criada, o handler cria mpsc com capacidade de 64 mensagens e coloca SessionStarted com o nome real da interface na fila. Em seguida registra daemon_session_started, inicia run_session_loop() com tokio::spawn e devolve ReceiverStream ao cliente.', 'daemon/src/server.rs · session(), PACKET_CHANNEL_CAPACITY'],
  loop: ['run_session_loop()', 'Mantém um leitor bloqueante da TUN e um loop que recebe mensagens do cliente. tokio::select! aguarda uma nova mensagem ou o oneshot que informa o término do leitor. EOF, erro ou uma segunda Config encerra o loop e inicia close().', 'daemon/src/server.rs · run_session_loop()'],
  outgoing: ['ClientMessage::OutgoingPacket', 'O loop recebe Packet.data do cliente. Ignora buffers vazios ou maiores que 65535 bytes; os demais são escritos na TUN. Uma segunda Config no stream é um erro InvalidArgument. Payload ausente é ignorado.', 'daemon/src/server.rs · ClientPayload::OutgoingPacket, MAX_PACKET_FRAME_SIZE'],
  write: ['TunSession::write_packet()', 'Executa send_intr() no SyncDevice com o InterruptEvent da sessão. O pacote entra na pilha IP do sistema pela TUN. Essa chamada síncrona é feita dentro do loop assíncrono que recebe o stream.', 'daemon/src/session.rs · write_packet() · daemon/src/server.rs'],
  reader: ['Leitor TUN · spawn_blocking', 'A tarefa bloqueante chama read_packet(), que usa um buffer de 65536 bytes e recv_intr(). Descarta quadros vazios ou maiores que 65535 bytes. Para os demais, monta ServerMessage::IncomingPacket e usa blocking_send() na fila de saída.', 'daemon/src/server.rs · read_task · daemon/src/session.rs · read_packet()'],
  incoming: ['Fila de saída · IncomingPacket', 'mpsc armazena até 64 ServerMessages, incluindo Started, IncomingPacket e Error. ReceiverStream expõe a fila como resposta IPC. Quando ela enche, blocking_send() bloqueia o leitor até haver espaço ou o receptor ser descartado.', 'daemon/src/server.rs · mpsc::channel(), ReceiverStream'],
  eof: ['Fim ou falha do stream do cliente', 'incoming.message() devolvendo None termina normalmente. Erros de leitura IPC, falha ao escrever na TUN ou uma segunda Config encerram o loop com erro. O resultado é preservado para o registro final e eventual SessionError.', 'daemon/src/server.rs · write_result'],
  readDone: ['read_done · oneshot', 'O leitor envia Option<String> ao terminar. Interrupted encerra a leitura sem erro; outras falhas produzem uma mensagem Error e carregam a descrição pelo oneshot. O loop principal observa esse sinal em tokio::select!.', 'daemon/src/server.rs · read_done_tx, read_done_rx'],
  close: ['TunSession::close()', 'AtomicBool::swap torna close() uma operação de execução única. Na primeira chamada, dispara InterruptEvent e retira o CleanupHook do mutex para executá-lo. Essa função não remove a reserva de active_sessions nem aguarda o read_task.', 'daemon/src/session.rs · close()'],
  interrupt: ['InterruptEvent::trigger()', 'Sinaliza às operações recv_intr() e send_intr() que a sessão está sendo fechada. Um recv_intr() interrompido faz o leitor sair do loop. A sinalização atua na E/S da TUN; não cancela um blocking_send() preso na fila IPC.', 'daemon/src/session.rs · close(), read_packet(), write_packet()'],
  cleanup: ['CleanupHook · rotas e DNS', 'O hook executa cleanup_routes(). Tenta remover as rotas em ordem inversa e chama o teardown DNS da plataforma, acumulando falhas em vez de desistir na primeira. Também é usado para tentar desfazer uma configuração parcialmente aplicada.', 'daemon/src/platform/mod.rs · CleanupHook, cleanup_routes(), into_cleanup_hook()'],
  join: ['Aguardar o leitor', 'Depois de close(), run_session_loop() aguarda read_task.await. Isso garante que o leitor saiu antes de liberar a reserva. O await não tem prazo próprio; falha de join é registrada como read_task_failed.', 'daemon/src/server.rs · close_result, read_join_result'],
  release: ['Liberar a reserva', 'Após aguardar o leitor, remove o nome real da interface de active_sessions. A TUN ainda pode ter referências vivas na tarefa; o descarte final acontece quando essas referências deixam de existir.', 'daemon/src/server.rs · sessions.remove(&interface_name)'],
  summary: ['Resultado da sessão', 'Preserva erros de stream, fechamento e join. Quando necessário, envia ServerMessage::Error. Registra outcome, duração e contexto nos eventos daemon_session e daemon_session_stopped.', 'daemon/src/server.rs · final de run_session_loop()'],
  done: ['Fim da tarefa e do stream', 'Ao terminar run_session_loop(), seus senders mpsc e suas referências à sessão são descartados. Sem senders, ReceiverStream termina após consumir a fila; sem referências ao dispositivo, o descritor nativo da TUN é fechado.', 'daemon/src/server.rs · run_session_loop() · daemon/src/session.rs · campos Arc'],
  shutdown: ['Sinais e dono · encerramento do processo', 'Ctrl+C, SIGTERM, pedido IPC autorizado ou saída do app iniciam o encerramento. O listener fecha, um watch cancela as conexões e main aguarda as sessões por até quatro segundos. Registra daemon_shutdown e encerra o Logger.', 'daemon/src/main.rs · run(), shutdown_signal()'],
  routes: ['Rotas · route_manager', 'Constrói rotas a partir de peer_allowed_ips e rotas de host para peer_endpoints. Consulta find_route(), filtra destinos e executa delete() antes de add(). Na implementação atual, as rotas de endpoint também recebem o nome da TUN. Essas operações usam a biblioteca route_manager, sem passar por run_command().', 'daemon/src/platform/mod.rs · build_and_filter_routes(), add_routes_with_predelete()'],
  table: ['Tabela de rotas do sistema', 'RouteManager consulta e altera as rotas do sistema operacional. As rotas selecionadas são capturadas no hook de limpeza. Falhas ao adicionar rotas retornam erro ao caminho de configuração da sessão.', 'daemon/src/platform/mod.rs · RouteManager'],
  linux: ['Linux · resolvectl', 'Depois de instalar rotas, executa resolvectl revert na interface. Com servidores e domínios, aplica resolvectl dns e resolvectl domain, prefixando os domínios com ~ para roteamento DNS. O teardown executa revert novamente.', 'daemon/src/platform/linux.rs · configure_session(), revert_dns()'],
  macos: ['macOS · scutil', 'Remove as entradas State:/Network/Interface/<nome>/DNS e a entrada raiz da interface. Depois configura ServerAddresses, SupplementalMatchDomains e UserDefinedName via stdin do scutil. O teardown remove as duas entradas.', 'daemon/src/platform/macos.rs · configure_session(), clear_dns_entries()'],
  windows: ['Windows · PowerShell / NRPT', 'Antes de criar a primeira TUN do processo, tenta remover regras NRPT antigas com o prefixo kmpvpn-daemon:. Na configuração, remove regras da interface e cria uma regra para cada domínio, com servidores e comentário enviados por variáveis de ambiente. O teardown remove as regras pelo comentário.', 'daemon/src/platform/windows.rs · prepare_session_start() em platform/mod.rs'],
  command: ['run_command() · comandos DNS', 'Executa resolvectl, scutil ou PowerShell com argumentos e ambiente. Se houver stdin, escreve a entrada antes de iniciar as threads leitoras e o cronômetro. Captura até 1 MiB por saída, consulta try_wait() a cada 25 ms e tenta encerrar o filho após 20 s. Status zero é tratado como sucesso.', 'daemon/src/platform/mod.rs · run_command(), read_capped()'],
  hookReady: ['Hook pronto ou rollback', 'Se a configuração terminar com sucesso, uma closure captura rotas e nome da interface para executar a limpeza futura. Se ocorrer erro, a limpeza é tentada imediatamente e a sessão não é anunciada como Started.', 'daemon/src/platform/mod.rs · into_cleanup_hook()'],
  mainEvents: ['Eventos do processo', 'Registra início e fim do daemon, conexões aceitas e rejeitadas e falhas. As mensagens incluem o endpoint e a identidade do processo quando aplicáveis.', 'daemon/src/main.rs · Logger::log()'],
  sessionEvents: ['Eventos das sessões', 'Registra início, rejeição, falhas e fim da sessão com o nome da interface. O fim inclui a duração em milissegundos.', 'daemon/src/server.rs · Logger::log()'],
  context: ['Contexto de cada linha', 'O logger acrescenta timestamp Unix em milissegundos e PID ao texto da mensagem. Quebras de linha são escapadas.', 'daemon/src/logging.rs · Logger::log()'],
  logQueue: ['Fila de logs', 'sync_channel mantém até 256 entradas. try_send descarta novos registros quando a fila enche. A escrita ocorre fora do executor Tokio.', 'daemon/src/logging.rs · Logger::with_writer()'],
  saver: ['Thread de escrita', 'Escreve uma linha de texto por mensagem. Um erro de escrita encerra o consumidor e os próximos registros são descartados.', 'daemon/src/logging.rs · Logger::with_writer()'],
  retire: ['Logger::flush()', 'Enfileira um pedido de flush se houver espaço e aguarda a resposta por até 500 ms. Uma saída bloqueada não impede o encerramento do processo.', 'daemon/src/logging.rs · Logger::flush()'],

let selected;
let currentView = 'overview';
function element(tag, attributes = {}, text) {
  const node = document.createElementNS(NS, tag);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
  if (text !== undefined) node.textContent = text;
  return node;
}
function choose(id) {
  selected = id;
  const [title, description, source] = details[id];
  document.getElementById('detail-title').textContent = title;
  document.getElementById('detail-text').textContent = description;
  document.getElementById('detail-source').textContent = source.replace(/(^| · )((?:daemon|daemon-proto)\/)/g, '$1' + root + '$2');
  svg.querySelectorAll('.node').forEach(node => node.classList.toggle('selected', node.dataset.id === id));
}
function draw(view) {
  currentView = view;
  const graph = graphs[view];
  svg.replaceChildren();
  svg.setAttribute('viewBox', `0 0 820 ${graph.height}`);
  svg.append(element('title', {id: 'diagram-title'}, graph.title), element('desc', {id: 'diagram-desc'}, graph.description));
  const definitions = element('defs');
  for (const [kind, color] of [['flow', 'var(--flow)'], ['packet', 'var(--packet)'], ['cleanup', 'var(--cleanup)'], ['logging', 'var(--logging)']]) {
    const marker = element('marker', {id: `arrow-${kind}`, viewBox: '0 0 8 8', refX: '7', refY: '4', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse'});
    marker.append(element('path', {d: 'M0 0 L8 4 L0 8 Z', fill: color}));
    definitions.append(marker);
  }
  svg.append(definitions);
  for (const [x, y, width, height, title] of graph.groups) {
    const group = element('g', {class: 'group'});
    group.append(element('rect', {x, y, width, height}), element('text', {x: x + 16, y: y + 26}, title));
    svg.append(group);
  }
  for (const [kind, path, , , , bidirectional] of graph.edges) {
    const attributes = {class: `edge ${kind}`, d: path, 'marker-end': `url(#arrow-${kind})`};
    if (bidirectional) attributes['marker-start'] = `url(#arrow-${kind})`;
    svg.append(element('path', attributes));
  }
  const labels = [];
  for (const [, , label, x, y] of graph.edges) {
    if (!label) continue;
    const group = element('g', {class: 'edge-label'});
    const text = element('text', {x, y: y + 3, 'text-anchor': 'middle'}, label);
    const background = element('rect', {x, y: y - 12, width: 0, height: 21});
    group.append(background, text);
    svg.append(group);
    labels.push([background, text, x]);
  }
  for (const [id, x, y, width, height, title, lines, tag] of graph.nodes) {
    const group = element('g', {class: 'node', role: 'button', tabindex: '0', 'aria-label': `Detalhes de ${details[id][0]}`, 'data-id': id});
    group.append(element('rect', {x, y, width, height}), element('text', {class: 'tag', x: x + 16, y: y + 20}, tag), element('text', {class: 'title', x: x + 16, y: y + 43}, title));
    lines.forEach((line, index) => group.append(element('text', {class: 'sub', x: x + 16, y: y + 64 + index * 18}, line)));
    group.addEventListener('click', () => choose(id));
    group.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); choose(id); }
    });
    svg.append(group);
  }
  for (const [background, text, x] of labels) {
    const width = text.getComputedTextLength() + 12;
    background.setAttribute('x', x - width / 2);
    background.setAttribute('width', width);
  }
  document.querySelectorAll('[data-view]').forEach(button => {
    const active = button.dataset.view === view;
    button.setAttribute('aria-selected', String(active));
    button.tabIndex = active ? 0 : -1;
  });
  document.getElementById('panel').setAttribute('aria-labelledby', `tab-${view}`);
  document.getElementById('foot').textContent = graph.foot;
  choose(graph.selected);
}
const tabs = [...document.querySelectorAll('[data-view]')];
tabs.forEach((button, index) => {
  button.addEventListener('click', () => draw(button.dataset.view));
  button.addEventListener('keydown', event => {
    let next;
    if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
    if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
    if (event.key === 'Home') next = 0;
    if (event.key === 'End') next = tabs.length - 1;
    if (next === undefined) return;
    event.preventDefault();
    tabs[next].focus();
    draw(tabs[next].dataset.view);
  });
});
draw(currentView);
