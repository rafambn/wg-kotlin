[package]
name = "daemon"
version = "0.1.12"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.10.1"
clap = { version = "4.5.53", features = ["derive"] }
http-body-util = "0.1.3"
libc = "0.2.177"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tonic = { version = "0.14.6", features = ["transport"] }
tower-layer = "0.3.3"
tun-rs = { version = "2.8", features = ["interruptible"] }

scribe-rs = { path = "../scribe-rs" }
daemon-proto = { path = "../daemon-proto" }


