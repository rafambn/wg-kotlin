[package]
name = "daemon"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "wg-kotlin-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
libc = "0.2.177"
serde_json = "1.0.145"
prost = "0.14.3"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1.18", features = ["sync", "net"] }
tonic = { version = "0.14.6", default-features = false }
tun-rs = { version = "2.8", features = ["interruptible"] }
which = "7.0.2"
scribe-rs = { path = "../scribe-rs" }
daemon-proto = { path = "../daemon-proto" }
route_manager = "0.2"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.8"
netlink-packet-route = "0.28"
netlink-sys = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }
