[package]
name = "daemon"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "wg-kotlin-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
libc = "0.2.177"
prost = "0.14.3"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util", "process"] }
tonic = { version = "0.14.6", default-features = false }
tun-rs = { version = "2.8", features = ["async_tokio"] }
which = "7.0.2"
hostname-validator = "1.1.1"
itertools = "0.14"
daemon-proto = { path = "../daemon-proto" }
route_manager = "0.2"

[dev-dependencies]
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
tempfile = { version = "=3.27.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
indexmap = "=2.14.0"
nix = { version = "0.30.1", features = ["net", "socket"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString"] }
objc2-system-configuration = { version = "0.3.2", default-features = false, features = ["std", "SCDynamicStore"] }
socket2 = { version = "0.6", features = ["all"] }
sysctl = "0.7.1"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.8"
netlink-packet-route = "0.28"
rtnetlink = "0.20"
futures-util = "0.3"
rustix = { version = "1", features = ["process", "event"] }
procfs-core = { version = "0.18", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
once_cell = "1.21.4"
nt-token = "0.5"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"
system-configuration-sys = "0.6"
