[package]
name = "daemon"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "wg-kotlin-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = { version = "0.14.6", features = ["transport"] }
tower = { version = "0.5.3", features = ["util"] }
tun-rs = { version = "2.8.8", features = ["interruptible"] }
which = "8.0.6"
scribe-rs = { path = "../scribe-rs" }
daemon-proto = { path = "../daemon-proto" }
route_manager = "0.2.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
