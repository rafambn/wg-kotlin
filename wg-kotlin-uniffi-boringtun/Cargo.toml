[package]
name = "wg-kotlin-uniffi-boringtun"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
base64 = "0.23.1"
boringtun = "=0.7.1"
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
thiserror = "2.0.20"
uniffi = { version = "0.29.5", features = ["bindgen"] }
